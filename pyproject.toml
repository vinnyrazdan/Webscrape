[project]
name = "pluralsight-mcp"
version = "0.1.0"
description = "Pluralsight training metadata MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "playwright>=1.54,<2",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
